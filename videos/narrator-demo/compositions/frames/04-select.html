  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="04-select"] .\\30 4-select-world').parentNode;
      const one = (sel) => root.querySelector(sel);
      const all = (sel) => Array.from(root.querySelectorAll(sel));
      const P = ".\\30 4-select-";

      const cursor = one(P + "cursor");
      const sel = one(P + "sel");
      const fill = one(P + "fill");
      const eTop = one('[data-e="top"]');
      const eBottom = one('[data-e="bottom"]');
      const eLeft = one('[data-e="left"]');
      const eRight = one('[data-e="right"]');
      const handles = all(P + "handle");
      const ripples = all(P + "ripple");
      const tag = one(P + "tag");

      const W = 940, H = 300;            // selection size
      const X0 = 180, Y0 = 285;          // press point (top-left of paragraph one)
      const CUR_START = { x: 1560, y: 640 };

      const tl = gsap.timeline({ paused: true });

      // Scene 1: keycaps drop in and press on the VO (press-release-spring)
      const cues = [0.62, 1.17, 1.82];
      cues.forEach((c, i) => {
        const key = one('[data-k="' + i + '"]');
        const face = key.querySelector(P + "face");
        const burst = key.querySelector(P + "burst");

        tl.fromTo(key, { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, c - 0.16);
        // press: linear compression, key lights up and stays held
        tl.fromTo(face, { y: 0, scale: 1, backgroundColor: "#FFFFFF" },
          { y: 7, scale: 0.92, backgroundColor: "#FFC729", duration: 0.1, ease: "power1.in" }, c);
        // release: spring back (start state == press end, adjacent positions)
        tl.to(face, { y: 3, scale: 1, duration: 0.5, ease: "back.out(2)" }, c + 0.1);
        // burst glow behind the key
        tl.fromTo(burst, { scale: 0.85, opacity: 0 }, { scale: 1.5, opacity: 0.75, duration: 0.3, ease: "power2.out" }, c + 0.1);
        tl.to(burst, { opacity: 0, duration: 0.45, ease: "power2.in" }, c + 0.42);
      });
      // "+" joiners arrive with the key that follows them
      tl.fromTo(one('[data-p="1"]'), { opacity: 0 }, { opacity: 1, duration: 0.16 }, cues[1] - 0.16);
      tl.fromTo(one('[data-p="2"]'), { opacity: 0 }, { opacity: 1, duration: 0.16 }, cues[2] - 0.16);

      // Scene 2: cursor glides to the first paragraph, presses, drags
      tl.fromTo(cursor, { x: CUR_START.x, y: CUR_START.y, opacity: 0, scale: 1 },
        { opacity: 1, duration: 0.15, ease: "power1.out" }, 1.95);
      tl.fromTo(cursor, { x: CUR_START.x, y: CUR_START.y },
        { x: X0, y: Y0, duration: 0.45, ease: "power3.out", immediateRender: false }, 1.95);

      // press (cursor compresses, stays slightly down while dragging)
      tl.to(cursor, { scale: 0.84, duration: 0.08, ease: "power2.in" }, 2.44);
      tl.to(cursor, { scale: 0.92, duration: 0.1, ease: "power2.out" }, 2.52);

      // ripple from the press point
      tl.fromTo(ripples, { scale: 0, opacity: 1 },
        { scale: 3.2, opacity: 0, duration: 0.6, ease: "power2.out", stagger: 0.08, immediateRender: false }, 2.48);

      // selection grows with the cursor on "drag"
      const DRAG_AT = 2.58, DRAG_DUR = 0.9, DRAG_EASE = "power2.inOut";
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.04 }, DRAG_AT - 0.04);
      tl.fromTo(cursor, { x: X0, y: Y0 }, { x: X0 + W, y: Y0 + H, duration: DRAG_DUR, ease: DRAG_EASE, immediateRender: false }, DRAG_AT);
      tl.fromTo(fill, { scaleX: 0, scaleY: 0 }, { scaleX: 1, scaleY: 1, duration: DRAG_DUR, ease: DRAG_EASE }, DRAG_AT);
      tl.fromTo(eTop, { scaleX: 0 }, { scaleX: 1, duration: DRAG_DUR, ease: DRAG_EASE }, DRAG_AT);
      tl.fromTo(eLeft, { scaleY: 0 }, { scaleY: 1, duration: DRAG_DUR, ease: DRAG_EASE }, DRAG_AT);
      tl.fromTo(eBottom, { y: 0, scaleX: 0 }, { y: H - 2, scaleX: 1, duration: DRAG_DUR, ease: DRAG_EASE }, DRAG_AT);
      tl.fromTo(eRight, { x: 0, scaleY: 0 }, { x: W - 2, scaleY: 1, duration: DRAG_DUR, ease: DRAG_EASE }, DRAG_AT);

      // Scene 3: release, handles pop at the corners, tag pins on "rather not read", hold
      tl.to(cursor, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 3.5);
      tl.fromTo(handles, { scale: 0 }, { scale: 1, duration: 0.32, ease: "back.out(2.2)", stagger: 0.04 }, 3.5);
      tl.fromTo(tag, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2)" }, 3.67);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-select"] = tl;
    })();
  </script>
