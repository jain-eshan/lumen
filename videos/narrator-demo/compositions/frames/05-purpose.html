    <script>
      (function () {
        const el = (id) => document.getElementById("05-purpose-" + id);
        const bloom = el("bloom");
        const label = el("label");
        const rule = el("rule");
        const panel = el("panel");
        const imgMood = el("img-mood");
        const imgVoice = el("img-voice");
        const cursor = el("cursor");
        const tag = el("tag");
        const bars = tag.querySelectorAll('[class~="05-purpose-bar"]');
        const ripA = document.querySelectorAll('[class~="05-purpose-ripple-a"]');
        const ripB = document.querySelectorAll('[class~="05-purpose-ripple-b"]');

        // Chip centres in frame px (panel at 365,250, scale 1190/1080)
        const WARM = { x: 845, y: 510 };
        const MAN_UK = { x: 1406, y: 589 };

        gsap.set([...ripA, ...ripB], { scale: 0 });
        gsap.set(bars, { scaleY: 0.15 });
        gsap.set(cursor, { x: 1150, y: 770 });

        const tl = gsap.timeline({ paused: true });

        // Scene 1: panel slides up over a sun bloom, label sets on 0.30
        tl.fromTo(bloom, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, 0);
        tl.fromTo(panel, { y: 90 }, { y: 0, duration: 0.95, ease: "power3.out" }, 0.05);
        tl.fromTo(panel, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.05);
        tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0.25);
        tl.fromTo(label.children, { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.06 }, 0.3);

        // Scene 2: on "mood" (2.02) the cursor clicks Warm; panel cuts to the mood state
        tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.15);
        tl.to(cursor, { x: WARM.x, y: WARM.y, duration: 0.6, ease: "power2.inOut" }, 1.34);
        tl.to(cursor, { scale: 0.85, duration: 0.08, ease: "power2.in" }, 1.96);
        tl.to(cursor, { scale: 1, duration: 0.08, ease: "power2.out" }, 2.04);
        tl.to(panel, { scale: 0.994, duration: 0.08, ease: "power2.in" }, 1.96);
        tl.to(panel, { scale: 1, duration: 0.08, ease: "power2.out" }, 2.04);
        tl.set(imgMood, { opacity: 1 }, 2.02);
        tl.set(ripA, { opacity: 1 }, 2.02);
        tl.to(ripA, { scale: 3.4, opacity: 0, duration: 0.65, ease: "power2.out", stagger: 0.08, immediateRender: false }, 2.02);

        // Scene 3: on "voice you like" the cursor clicks Man (UK) at 2.96; panel cuts to the voice state, sample tag pops at 3.05

        tl.to(cursor, { scale: 0.85, duration: 0.08, ease: "power2.in" }, 2.9);

        tl.set(imgVoice, { opacity: 1 }, 2.96);
        tl.set(ripB, { opacity: 1 }, 2.96);
        tl.to(ripB, { scale: 3.4, opacity: 0, duration: 0.65, ease: "power2.out", stagger: 0.08, immediateRender: false }, 2.96);

        window.__timelines["05-purpose"] = tl;
