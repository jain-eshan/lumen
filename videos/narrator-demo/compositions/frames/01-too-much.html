  <script>
    (function () {
      var ID = "01-too-much";
      var DURATION = 5.24;
      var $ = function (s) { return document.getElementById(ID + "-" + s); };

      // ---- build the wall of text (generic bars, no words), deterministic widths ----
      var LINE_PITCH = 38;
      var LINES = 18;
      var cols = [$("col-0"), $("col-1"), $("col-2")];
      var colBars = cols.map(function (col, c) {
        var bars = [];
        var head = document.createElement("div");
        head.className = ID + "-bar " + ID + "-bar-head";
        head.style.top = "0px";
        head.style.width = (48 + c * 9) + "%";
        col.appendChild(head);
        bars.push(head);
        for (var i = 0; i < LINES; i++) {
          var bar = document.createElement("div");
          bar.className = ID + "-bar";
          var paraEnd = (i + c * 2) % 6 === 5;
          var w = paraEnd ? 30 + ((i * 13 + c * 7) % 22) : 78 + ((i * 37 + c * 23) % 22);
          bar.style.top = (60 + i * LINE_PITCH) + "px";
          bar.style.width = w + "%";
          col.appendChild(bar);
          bars.push(bar);
        }
        return bars;
      });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- VO cues (assets/voice/01.wav word timings) ----
      var T_SWAP = 3.23;    // "Don't."
      var T_MARK = 3.96;    // "listen."
      var CLEAR_START = 3.08;

      // ---- ground: bloom settles in, then swells on the relief line ----
      tl.fromTo($("bloom"), { scale: 0.9, opacity: 0.75 }, { scale: 1, opacity: 1, duration: 3.0, ease: "sine.out" }, 0);
      tl.to($("bloom"), { scale: 1.12, duration: 1.0, ease: "power2.out" }, T_SWAP);

      // ---- Scene 1: text piles up, column by column, line by line ----
      var COL_OFFSET = [0.0, 0.18, 0.36];
      colBars.forEach(function (bars, c) {
        tl.fromTo(bars, { opacity: 0, y: 28 }, {
          opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.1
        }, 0.02 + COL_OFFSET[c]);
      });

      // slow upward drift + push on the wall (camera under the shot)
      tl.fromTo($("world"), { y: 40, scale: 1 }, { y: -50, scale: 1.08, duration: 3.4, ease: "none" }, 0);

      // depth-of-field: focal pull, far planes blur more, all dim; headline stays sharp
      var BLUR_PER_DEPTH = 4;
      var DIM_LEVEL = 0.65;
      cols.forEach(function (col) {
        var depth = Number(col.getAttribute("data-depth")) || 1;
        tl.fromTo(col, { "--dof": "0px", opacity: 1 }, {
          "--dof": (BLUR_PER_DEPTH * depth) + "px", opacity: DIM_LEVEL, duration: 2.0, ease: "power2.inOut"
        }, 0.4);
      });

      // ---- headline assembles word by word on the VO (pre-computed sequence) ----
      var CONTENT = [
        { el: $("w0"), cue: 0.45 },  // Too
        { el: $("w1"), cue: 0.69 },  // much
        { el: $("w2"), cue: 0.99 },  // to
        { el: $("w3"), cue: 1.18 },  // read,
        { el: $("w4"), cue: 1.54 },  // and
        { el: $("w5"), cue: 1.78 },  // zero
        { el: $("w6"), cue: 2.08 },  // energy
        { el: $("w7"), cue: 2.50 },  // to
        { el: $("w8"), cue: 2.69 },  // read
        { el: $("w9"), cue: 2.99 }   // it?
      ];
      var TIMELINE = CONTENT.map(function (entry, i) {
        var next = CONTENT[i + 1];
        return { el: entry.el, start: entry.cue, end: next ? next.cue : T_SWAP };
      });
      gsap.set(TIMELINE.map(function (e) { return e.el; }), { visibility: "hidden" });
      TIMELINE.forEach(function (entry) {
        tl.set(entry.el, { visibility: "visible" }, entry.start);
        tl.fromTo(entry.el, { yPercent: 22, scale: 1.14 }, {
          yPercent: 0, scale: 1, duration: 0.24, ease: "power3.out"
        }, entry.start);
      });

      // ---- Scene 3: discrete hard cut, same position, no in-between ----
      var SEQUENCE = [
        { t: 0, show: $("line-a"), hide: $("line-b") },
        { t: T_SWAP, show: $("line-b"), hide: $("line-a") }
      ];
      // opacity, not visibility: the words inside line A set their own visibility,
      // which would override a hidden parent
      gsap.set($("line-b"), { opacity: 0 });
      SEQUENCE.forEach(function (s) {
        tl.set(s.show, { opacity: 1 }, s.t);
        tl.set(s.hide, { opacity: 0 }, s.t);
      });
      tl.fromTo($("line-b"), { scale: 1.05 }, { scale: 1, duration: 0.3, ease: "power3.out" }, T_SWAP);

      // background text clears: blur out + fade
      cols.forEach(function (col, i) {
        tl.to(col, { "--dof": "22px", opacity: 0, duration: 0.6, ease: "power2.in" }, CLEAR_START + i * 0.05);
      });

      // sun marker sweeps under "listen." as the VO says it, then everything holds
      tl.fromTo($("mark-bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, T_MARK);

      // span the full frame window
      tl.to({}, { duration: DURATION }, 0);
      window.__timelines["01-too-much"] = tl;
    })();
  </script>
