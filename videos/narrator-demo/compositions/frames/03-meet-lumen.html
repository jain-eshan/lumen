  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="03-meet-lumen"]');
      const $ = (id) => root.querySelector("#" + id);

      const track = $("meet-lumen-03-track");
      const flutter = $("meet-lumen-03-flutter");
      const tilt = $("meet-lumen-03-tilt");
      const fly = $("meet-lumen-03-fly");
      const read = $("meet-lumen-03-read");
      const wave = $("meet-lumen-03-wave");
      const glow = $("meet-lumen-03-glow");
      const blurNode = $("meet-lumen-03-streak-blur");
      const subWords = root.querySelectorAll(".meet-lumen-03-subword");
      const kickerWords = root.querySelectorAll(".meet-lumen-03-kword");

      const tl = gsap.timeline({ paused: true });

      // initial pose + glow state
      tl.set(fly, { opacity: 1 }, 0);
      tl.set([read, wave], { opacity: 0 }, 0);

      // brand bug: fades in, never moves
      tl.fromTo("#meet-lumen-03-bug", { opacity: 0 }, { opacity: 0.85, duration: 0.3, ease: "power1.out" }, 0);

      // ── Scene 1 (0.0–1.7s): glide in from upper right on a descending arc toward the Dock ──
      const MOVE_START = 0;
      const MOVE_DUR = 2.0;
      const MOVE_EASE = "power3.out";

      tl.fromTo(track, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, MOVE_START);
      tl.fromTo(track, { x: 620 }, { x: 0, duration: MOVE_DUR, ease: MOVE_EASE }, MOVE_START);
      tl.fromTo(track, { y: -400 }, { y: -18, duration: MOVE_DUR, ease: "sine.inOut" }, MOVE_START);
      tl.fromTo(tilt, { rotation: -12 }, { rotation: 0, duration: MOVE_DUR, ease: "power2.out" }, MOVE_START);

      // light directional streak, riding the same window + ease as the glide
      const PEAK_BLUR = 9;
      const blurProxy = { v: PEAK_BLUR };
      const writeBlur = () =>
        blurNode.setAttribute("stdDeviation", blurProxy.v.toFixed(2) + " " + (blurProxy.v * 0.4).toFixed(2));
      writeBlur();
      tl.to(blurProxy, { v: 0, duration: MOVE_DUR, ease: MOVE_EASE, onUpdate: writeBlur }, MOVE_START);

      // flutter: three small bobs that decay to rest by the landing (bounded, ends at exactly 0)
      const bob = { p: 0 };
      tl.to(
        bob,
        {
          p: 1,
          duration: MOVE_DUR,
          ease: "none",
          onUpdate: () => {
            const y = Math.sin(bob.p * Math.PI * 6) * 7 * (1 - bob.p);
            flutter.style.transform = "translateY(" + y.toFixed(2) + "px)";
          },
        },
        MOVE_START,
      );

      // "And it has a face." sets word by word, 0.30 to 0.98
      tl.fromTo(
        kickerWords,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.17 },
        0.3,
      );

      // ── Scene 2 (1.7–2.7s): "Meet" on 1.76, "Lumen" on 2.08; Lumen lands and reads ──
      tl.fromTo(
        "#meet-lumen-03-meet",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" },
        1.76,
      );
      tl.fromTo(
        "#meet-lumen-03-lumen",
        { opacity: 0, x: 48 },
        { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" },
        2.08,
      );
      tl.to(fly, { opacity: 0, duration: 0.14, ease: "none" }, 2.08);
      tl.to(read, { opacity: 1, duration: 0.14, ease: "none" }, 2.08);
      tl.to(track, { y: 0, duration: 0.35, ease: "power2.out" }, 2.08);

      // ── Scene 3 (2.7–5.53s): subline sets word by word from 2.73, "Dock" lands on 4.54 ──
      tl.fromTo(
        subWords,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.2 },
        2.73,
      );

      // on "Dock" Lumen waves with a small hop; sun glow blooms behind, then hold
      tl.to(read, { opacity: 0, duration: 0.14, ease: "none" }, 4.54);
      tl.to(wave, { opacity: 1, duration: 0.14, ease: "none" }, 4.54);
      tl.to(track, { y: -12, duration: 0.16, ease: "power2.out" }, 4.54);
      tl.to(track, { y: 0, duration: 0.19, ease: "power2.in" }, 4.7);

      // ambient-glow-bloom, bloom-and-hold: lands with the hop (4.89s)
      tl.fromTo(
        glow,
        { opacity: 0, scale: 0.85 },
        { opacity: 0.32, scale: 1, duration: 0.55, ease: "power2.out" },
        4.34,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["03-meet-lumen"] = tl;
    })();
  </script>
