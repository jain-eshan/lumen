  <script>
    (function () {
      const ID = "07-follow-ask";
      const $ = (s) => document.getElementById(ID + "-" + s);
      const tl = gsap.timeline({ paused: true });

      const page = $("page");
      const bar = $("bar");
      const card = $("card");
      const user = $("user");
      const label = $("label");
      const reply = $("reply");
      const keysRow = $("keys");
      const keys = keysRow.querySelectorAll(".fa07-key");
      const pluses = keysRow.querySelectorAll(".fa07-plus");
      const box = $("box");
      const patch = $("patch");
      const textEl = $("text");
      const caret = $("caret");
      const lumen = $("lumen");
      const pose = (n) => lumen.querySelector('[data-pose="' + n + '"]');
      const dots = $("dots").querySelectorAll("b");

      // ---- Scene 1 (0.0 to 1.6s): chat card enters with the user bubble
      tl.fromTo(card, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.05);
      tl.fromTo(user, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      // ---- Scene 2 (1.6 to 3.7s): on "It reads every new reply out loud" the Following bar slides down
      tl.fromTo(bar, { opacity: 0, y: -250 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 1.64);

      // reply streams word by word (content-length timing)
      const LINES = [
        "Start small enough that skipping feels silly.",
        "Tie it to something you already do, like making coffee.",
        "And track your streak, because watching it grow",
        "is its own reward.",
      ];
      const lineEls = [];
      const WORDS = [];
      LINES.forEach((line, li) => {
        const lineEl = document.createElement("div");
        lineEl.className = "fa07-line";
        line.split(" ").forEach((w, wi, arr) => {
          const span = document.createElement("span");
          span.className = "fa07-word";
          span.textContent = w;
          lineEl.appendChild(span);
          if (wi < arr.length - 1) lineEl.appendChild(document.createTextNode(" "));
          WORDS.push({ el: span, line: li, len: w.length });
        });
        reply.appendChild(lineEl);
        lineEls.push(lineEl);
      });

      tl.fromTo(label, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.66);

      const STREAM_START = 1.82;
      const STREAM_END = 3.4;
      const BASE = 0.02;
      const SEC_PER_CHAR = 0.012;
      const raw = WORDS.map((w) => BASE + (w.len + 1) * SEC_PER_CHAR);
      const rawTotal = raw.reduce((a, b) => a + b, 0);
      const k = (STREAM_END - STREAM_START) / rawTotal;
      let cum = STREAM_START;
      const lineStart = [];
      WORDS.forEach((w, i) => {
        w.start = cum;
        cum += raw[i] * k;
        if (lineStart[w.line] === undefined) lineStart[w.line] = w.start;
        tl.fromTo(w.el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, w.start);
      });
      const HL_ON = "rgba(255, 199, 41, 0.34)";
      const HL_OFF = "rgba(255, 199, 41, 0)";
      lineEls.forEach((el, li) => {
        tl.fromTo(el, { backgroundColor: HL_OFF }, { backgroundColor: HL_ON, duration: 0.2, ease: "power1.out" }, lineStart[li]);
        if (li > 0) {
          tl.fromTo(
            lineEls[li - 1],
            { backgroundColor: HL_ON },
            { backgroundColor: HL_OFF, duration: 0.3, ease: "power1.out", immediateRender: false },
            lineStart[li]
          );
        }
      });

      // Lumen lip-sync: lumen-talk at the listed word starts, about 0.12s each
      const TALK = [1.64, 1.82, 2.19, 2.55, 2.8, 3.16, 3.4];
      const read = pose("read");
      const talk = pose("talk");
      const listen = pose("listen");
      const think = pose("think");
      TALK.forEach((s, i) => {
        const next = i < TALK.length - 1 ? TALK[i + 1] : Infinity;
        const end = Math.min(s + 0.12, next - 0.03);
        tl.set(talk, { opacity: 1 }, s);
        tl.set(read, { opacity: 0 }, s);
        tl.set(talk, { opacity: 0 }, end);
        tl.set(read, { opacity: 1 }, end);
      });

      // ---- Scene 3 (3.7 to 4.9s): on "Stuck on something?" the page plane racks back, Ask box drops in, Lumen listens
      const FOCUS_START = 3.77;
      tl.fromTo(card, { "--dof": "0px", opacity: 1 }, { "--dof": "6px", opacity: 0.5, duration: 0.8, ease: "power2.inOut", immediateRender: false }, FOCUS_START);
      tl.fromTo(bar, { "--dof": "0px", opacity: 1 }, { "--dof": "8px", opacity: 0.45, duration: 0.8, ease: "power2.inOut", immediateRender: false }, FOCUS_START);
      tl.fromTo(page, { scale: 1 }, { scale: 0.965, duration: 0.8, ease: "power2.inOut" }, FOCUS_START);
      tl.fromTo(box, { opacity: 0, y: -70 }, { opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.1)" }, 3.82);
      tl.set(read, { opacity: 0 }, 3.77);
      tl.set(listen, { opacity: 1 }, 3.77);

      // ---- Scene 4 (4.9 to 8.05s): keycaps press in, the question types, submit, Lumen thinks
      const KEY_T = [5.35, 5.84, 6.26];
      keys.forEach((key, i) => {
        const t = KEY_T[i];
        if (i > 0) tl.fromTo(pluses[i - 1], { opacity: 0 }, { opacity: 1, duration: 0.2 }, t - 0.05);
        tl.fromTo(key, { opacity: 0, scale: 0.7, y: -12 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(2)" }, t);
        tl.fromTo(key, { y: 0, backgroundColor: "#fffdf7" }, { y: 5, backgroundColor: "#ffc729", duration: 0.08, ease: "power2.in", immediateRender: false }, t + 0.34);
        tl.fromTo(key, { y: 5, backgroundColor: "#ffc729" }, { y: 0, backgroundColor: "#ffe394", duration: 0.22, ease: "back.out(3)", immediateRender: false }, t + 0.42);
      });

      // placeholder clears, caret blinks, then the question types behind the caret
      tl.set(patch, { opacity: 1 }, 5.4);
      tl.set(caret, { opacity: 1 }, 5.4);
      tl.set(caret, { opacity: 0 }, 5.75);
      tl.set(caret, { opacity: 1 }, 6.05);

      const Q = "Why does the Moon cause tides?";
      // types from 6.3 and lands just before the submit on "ask" (7.0)
      const TYPE_START = 6.3;
      const SEC_PER_TYPED = 0.023;
      // one span per character, revealed by tl.set (no callbacks, so seeking with suppressed events still shows it)
      Q.split("").forEach((ch, i) => {
        const c = document.createElement("span");
        c.textContent = ch;
        c.style.display = "none";
        textEl.appendChild(c);
        tl.set(c, { display: "inline" }, TYPE_START + i * SEC_PER_TYPED);
      });

      // submit: caret stops, the Ask box takes a short press
      const SUBMIT = 7.0;
      tl.set(caret, { opacity: 0 }, SUBMIT);
      tl.fromTo(box, { scale: 1 }, { scale: 0.985, duration: 0.09, ease: "power2.in", immediateRender: false }, SUBMIT);
      tl.fromTo(box, { scale: 0.985 }, { scale: 1, duration: 0.26, ease: "back.out(3)", immediateRender: false }, SUBMIT + 0.09);

      // on "ask": Lumen thinks, three dots pop and pulse in turn (finite, deterministic)
      tl.set(listen, { opacity: 0 }, 7.0);
      tl.set(think, { opacity: 1 }, 7.0);
      dots.forEach((d, i) => {
        tl.fromTo(d, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 7.02 + i * 0.08);
      });
      for (let p = 0, t = 7.4; t + 0.2 <= 8.05; p++, t += 0.18) {
        const d = dots[p % 3];
        tl.fromTo(d, { opacity: 1 }, { opacity: 0.3, duration: 0.09, ease: "power1.inOut", immediateRender: false }, t);
        tl.fromTo(d, { opacity: 0.3 }, { opacity: 1, duration: 0.09, ease: "power1.inOut", immediateRender: false }, t + 0.09);
      }

      // hold to the frame's fixed length
      tl.set({}, {}, 8.05);

      window.__timelines[ID] = tl;
    })();
  </script>
