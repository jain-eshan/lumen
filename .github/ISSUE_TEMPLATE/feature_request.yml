name: Idea or feature request
description: Something Lumen could do that it does not do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Start with the situation, not the solution. What were you reading, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Lumen to do?
    validations:
      required: false
